services:
  postgres:
    image: postgres:alpine
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: lara_health
    ports:
      - "5432:5432"
    volumes:
      # Updated mount path for Postgres 18+
      - postgres_data:/var/lib/postgresql
    healthcheck:
      # Fixed to match the POSTGRES_DB name
      test: ["CMD-SHELL", "pg_isready -U postgres -d lara_health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
      driver: local